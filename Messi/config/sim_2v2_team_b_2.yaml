# Simulation config for Team B Robot 2.
# Common measured values are inherited from config.yaml. Keep normal sim files
# limited to per-robot role/identity; uncomment blocks below only for sim tuning.
base_config: config.yaml

role: goalkeeper
dog_namespace: team_b/robot_2

topics:
  prefix: /soccer/team/team_b/robot_2

rigids:
  self: team_b_2
  teammate: team_b_1
  opponent_1: team_a_1
  opponent_2: team_a_2
  ball: soccer_ball
  attack_goal: goal_a
  defense_goal: goal_b

sim:
  team: team_b
  robot_id: robot_2
  kickoff_pose:
    x: 0.0
    y: 4.72
    yaw: 0.0
  home_pose:
    x: 0.0
    y: 4.5
    yaw: -1.5708

